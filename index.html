<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSFS Flight Display</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background-color: #121212;
      color: #fff;
    }
    #sidebar {
      width: 340px;
      background: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
    }
    h2 {
      font-size: 1.1rem;
      color: #4da6ff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .file-input-container input[type="file"] {
      width: 100%;
      background: #2a2a2a;
      color: #fff;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .controls-row {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 8px 4px;
      background: #4da6ff;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.8rem;
    }
    button.btn-primary {
      background: #3385d6;
      color: #fff;
    }
    button.btn-primary:hover {
      background: #2869ab;
    }
    button:hover {
      background: #3385d6;
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
    }
    .timeline-container label {
      font-size: 0.8rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #4da6ff;
      cursor: pointer;
    }
    .speed-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    select {
      background: #1e1e1e;
      color: #4da6ff;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .info-card {
      background: #2a2a2a;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .info-label {
      color: #aaa;
    }
    .info-value {
      font-weight: bold;
      color: #fff;
    }
    
    .aircraft-image-container {
      width: 100%;
      height: 160px;
      background: #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
    }
    .aircraft-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .aircraft-image-placeholder {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      padding: 10px;
    }

    #status {
      font-size: 0.8rem;
      padding: 8px;
      border-radius: 4px;
      display: none;
      word-break: break-word;
    }
    #map {
      flex: 1;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>SkyDoll File (.csv)</h2>
    <div class="file-input-container">
      <input type="file" id="csvFile" accept=".csv">
    </div>
    <div id="status"></div>

    <h2>Aircraft Image</h2>
    <div class="aircraft-image-container">
      <div id="imgPlaceholder" class="aircraft-image-placeholder">No image found in CSV</div>
      <img id="aircraftImg" src="" alt="Aircraft Image" style="display: none;">
    </div>

    <h2>Flight Summary</h2>
    <div class="info-card">
      <div class="info-row"><span class="info-label">Start:</span><span id="valStartUTC" class="info-value">-</span></div>
      <div class="info-row"><span class="info-label">End:</span><span id="valEndUTC" class="info-value">-</span></div>
      <div class="info-row"><span class="info-label">Total Distance:</span><span id="valTotalDistance" class="info-value">-</span></div>
    </div>

    <h2>Playback Controls</h2>
    <div class="controls-grid">
      <div class="controls-row">
        <button id="playBtn" class="btn-primary" disabled>Play</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>
      <div class="controls-row">
        <button id="skipBack10m" disabled>-10m</button>
        <button id="skipBack1m" disabled>-1m</button>
        <button id="skipForward1m" disabled>+1m</button>
        <button id="skipForward10m" disabled>+10m</button>
      </div>
    </div>

    <div class="speed-container">
      <span style="color: #aaa;">Speed:</span>
      <select id="speedSelect" disabled>
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="5" selected>5x</option>
        <option value="10">10x</option>
        <option value="20">20x</option>
        <option value="30">30x</option>
        <option value="40">40x</option>
        <option value="50">50x</option>
        <option value="60">60x</option>
        <option value="70">70x</option>
        <option value="80">80x</option>
        <option value="90">90x</option>
        <option value="100">100x</option>
      </select>
    </div>

    <div class="timeline-container">
      <label>
        <span>Flight Progress</span>
        <span id="timeDisplay">0 / 0</span>
      </label>
      <input type="range" id="timeline" min="0" value="0" step="1" disabled>
    </div>

    <h2>Telemetry Data</h2>
    <div class="info-card">
      <div class="info-row"><span class="info-label">Callsign:</span><span id="valCallsign" class="info-value">-</span></div>
      <div class="info-row"><span class="info-label">UTC Time:</span><span id="valUTC" class="info-value">-</span></div>
      <div class="info-row"><span class="info-label">Altitude:</span><span id="valAltitude" class="info-value">- ft</span></div>
      <div class="info-row"><span class="info-label">Speed:</span><span id="valSpeed" class="info-value">- kts TAS</span></div>
      <div class="info-row"><span class="info-label">Heading:</span><span id="valDirection" class="info-value">-°</span></div>
      <div class="info-row"><span class="info-label">Distance Covered:</span><span id="valCoveredDistance" class="info-value">-</span></div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="script.js"></script>
</body>
</html>
